name: Compact Android artifact

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Build Android run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-android-aarch64-release
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: original
      - name: Strip packaging symbols
        run: |
          if ! command -v llvm-strip; then
            sudo apt-get update
            sudo apt-get install -y llvm
          fi
          mkdir compact
          tar xzf original/codex-android-aarch64-release.tar.gz -C compact
          for binary in codex codex-exec codex-tui; do
            llvm-strip --strip-all "compact/$binary"
          done
          cd compact
          sha256sum codex codex-exec codex-tui > SHA256SUMS
          tar czf ../codex-android-aarch64-release-stripped.tar.gz codex codex-exec codex-tui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-android-aarch64-release-stripped
          path: |
            codex-android-aarch64-release-stripped.tar.gz
            compact/SHA256SUMS
          retention-days: 7
